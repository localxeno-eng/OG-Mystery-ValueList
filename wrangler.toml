name = "og-mystery-valuelist"
main = "worker/index.js"
compatibility_date = "2024-09-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "PSOG_KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# Secrets (do NOT put real values here — set them with `wrangler secret put <NAME>`):
#   ADMIN_ACCESS_CODE
#   SESSION_SECRET  (optional, falls back to ADMIN_ACCESS_CODE)
